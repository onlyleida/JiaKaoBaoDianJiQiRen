name: Build reconstructed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild, sign and verify
        run: |
          sdkmanager 'build-tools;35.0.0' > /dev/null
          python3 scripts/build.py
          cp dist/build-verification.json dist/ci-build-verification.json
          cp dist/signature.txt dist/ci-signature.txt
      - name: Attach APK and verification to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apk-11.6.5-rebuild \
            dist/jiakaoyi-coach-11.6.5-rebuilt-debug.apk \
            dist/jiakaoyi-coach-11.6.5-rebuilt-debug.apk.sha256 \
            dist/ci-build-verification.json \
            dist/ci-signature.txt \
            --clobber
