name: Build reconstructed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android command line tools
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$RUNNER_TEMP/android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses < "$RUNNER_TEMP/android-license-answers" > /dev/null
      - name: Rebuild, sign and verify
        id: build
        run: |
          sdkmanager 'build-tools;35.0.0' > /dev/null
          python3 scripts/build.py
          cp dist/build-verification.json dist/ci-build-verification.json
          cp dist/signature.txt dist/ci-signature.txt
      - name: Attach APK and verification to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload apk-11.6.5-rebuild \
            dist/jiakaoyi-coach-11.6.5-rebuilt-debug.apk \
            dist/jiakaoyi-coach-11.6.5-rebuilt-debug.apk.sha256 \
            dist/ci-build-verification.json \
            dist/ci-signature.txt \
            --clobber
      - name: Install Android 11 ARM translation image
        id: runtime_sdk
        continue-on-error: true
        timeout-minutes: 12
        run: sdkmanager 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86' > /dev/null
      - name: Collect offline installation and startup evidence
        id: runtime_check
        if: steps.runtime_sdk.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: python3 scripts/runtime_smoke.py
      - name: Attach runtime evidence
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/runtime
          if [ ! -f dist/runtime/ci-runtime-verification.json ]; then
            echo '{"status":"runtime_evidence_unavailable","source_commit":"${{ github.sha }}","sdk_step_outcome":"${{ steps.runtime_sdk.outcome }}","runtime_step_outcome":"${{ steps.runtime_check.outcome }}","full_teaching_functionality_tested":false}' > dist/runtime/ci-runtime-verification.json
          fi
          (cd dist/runtime && zip -q -r ../ci-runtime-evidence.zip .)
          gh release upload apk-11.6.5-rebuild \
            dist/runtime/ci-runtime-verification.json \
            dist/ci-runtime-evidence.zip --clobber
          for shot in dist/runtime/screen-after-*.png; do
            if [ -f "$shot" ]; then
              gh release upload apk-11.6.5-rebuild "$shot" --clobber
            fi
          done
