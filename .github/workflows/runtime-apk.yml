name: Check release APK runtime

on:
  workflow_dispatch:
    inputs:
      api:
        description: Android API level for the existing release APK
        type: choice
        options: ['28', '30']
        default: '28'

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JIAKAO_RUNTIME_API: ${{ inputs.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android command line tools
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$RUNNER_TEMP/android-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-answers"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses < "$RUNNER_TEMP/android-license-answers" > /dev/null
      - name: Download and verify the existing APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download apk-11.6.5-rebuild --dir dist \
            --pattern 'jiakaoyi-coach-11.6.5-rebuilt-debug.apk*'
          (cd dist && sha256sum --check jiakaoyi-coach-11.6.5-rebuilt-debug.apk.sha256)
      - name: Install official emulator image
        run: sdkmanager 'platform-tools' 'emulator' "system-images;android-$JIAKAO_RUNTIME_API;google_apis;x86" > /dev/null
      - name: Collect offline installation and startup evidence
        timeout-minutes: 12
        continue-on-error: true
        run: python3 scripts/runtime_smoke.py
      - name: Attach API-specific evidence to release
        if: always() && steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/runtime
          if [ ! -f dist/runtime/ci-runtime-verification.json ]; then
            echo '{"status":"runtime_evidence_unavailable","full_teaching_functionality_tested":false}' > dist/runtime/ci-runtime-verification.json
          fi
          evidence="ci-runtime-api$JIAKAO_RUNTIME_API"
          (cd dist/runtime && zip -q -r "../$evidence-evidence.zip" .)
          cp dist/runtime/ci-runtime-verification.json "dist/$evidence-verification.json"
          gh release upload apk-11.6.5-rebuild "dist/$evidence-evidence.zip" "dist/$evidence-verification.json" --clobber
          for shot in dist/runtime/screen-after-*.png; do
            if [ -f "$shot" ]; then
              target="dist/api$JIAKAO_RUNTIME_API-$(basename "$shot")"
              cp "$shot" "$target"
              gh release upload apk-11.6.5-rebuild "$target" --clobber
            fi
          done
