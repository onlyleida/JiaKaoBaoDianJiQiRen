name: Test local compatibility backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/test-local-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test-local-server.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: server
      - name: Local HTTP contracts and persistence
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s server -v
